<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Phrasal-Filmer AR</title>
    <!-- Versiyonu 1.3.0 yaparak daha stabil bir yapı kuruyoruz -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.1/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; font-family: sans-serif; text-align: center;
        }
        #btn {
            padding: 20px 40px; font-size: 22px; background: #27ae60;
            color: white; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h2>Phrasal-Filmer: LFT</h2>
        <p>Kamerayı kullanmak için butona basın.</p>
        <button id="btn">BAŞLAT</button>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: lft.mind; autoStart: false; uiScanning: yes;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- lft.mp4 dosyanın burada doğru olduğundan eminiz -->
            <video id="arVideo" src="lft.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Hedef Bulunduğunda Görünecek Katman -->
        <a-entity id="targetAnchor" mindar-image-target="targetIndex: 0">
            <!-- a-plane kullanımı a-video'dan daha kararlıdır -->
            <a-plane id="videoPlane" material="src: #arVideo; shader: flat;" 
                     width="1" height="0.56" position="0 0 0" rotation="0 0 0"></a-plane>
        </a-entity>
    </a-scene>

    <script>
        const startBtn = document.getElementById('btn');
        const overlay = document.getElementById('overlay');
        const video = document.getElementById('arVideo');
        const sceneEl = document.querySelector('a-scene');

        startBtn.addEventListener('click', () => {
            // Android Ses ve Görüntü Kilidini Elle Açma
            video.play().then(() => {
                video.pause();
                video.currentTime = 0;
            });

            sceneEl.systems["mindar-image-system"].start();
            overlay.style.display = 'none';
        });

        const targetEl = document.querySelector('#targetAnchor');
        
        targetEl.addEventListener("targetFound", () => {
            console.log("Hedef Tespit Edildi");
            video.play();
        });

        targetEl.addEventListener("targetLost", () => {
            video.pause();
        });
    </script>
</body>
</html>
