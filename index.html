<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; font-family: sans-serif;
        }
        #btn { padding: 15px 35px; font-size: 20px; background: #27ae60; color: white; border: none; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="overlay">
        <h2>"Look Forward To" AR</h2>
        <button id="btn">DENEYİMİ BAŞLAT</button>
    </div>

   <!-- Sahne içindeki ilgili satırları bunlarla değiştirmen yeterli -->
<a-scene 
    mindar-image="imageTargetSrc: lft.mind; autoStart: false; uiScanning: yes; filterMinCF: 0.0001; filterBeta: 0.1;" 
    embedded color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false">
    
    <a-assets>
        <video id="lftVid" src="lft.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
        <!-- Boyutları 1.8 ve 1.01 yaparak büyüttük, sarsıntı için derinliği 0.1 yaptık -->
        <a-video src="#lftVid" width="1.8" height="1.01" position="0 0 0.1" material="shader: flat; side: double;"></a-video>
    </a-entity>
</a-scene>

    <script>
        const btn = document.getElementById('btn');
        const video = document.getElementById('lftVid');
        const scene = document.querySelector('a-scene');

        btn.addEventListener('click', () => {
            // Android ses ve görüntü kilidini açan zorunlu dokunuş
            video.play().then(() => {
                video.pause();
                video.currentTime = 0;
            });
            scene.systems["mindar-image-system"].start();
            document.getElementById('overlay').style.display = 'none';
        });

        const target = document.querySelector('#target');
        target.addEventListener("targetFound", () => { 
            console.log("Hedef Algılandı!"); 
            video.play(); 
        });
        target.addEventListener("targetLost", () => { 
            video.pause(); 
        });
    </script>
</body>
</html>
