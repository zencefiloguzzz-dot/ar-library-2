<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Phrasal-Filmer AR - LFT</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center;
        }
        #start-btn {
            padding: 15px 30px; font-size: 20px; background: #2196F3;
            color: white; border: none; border-radius: 10px; cursor: pointer;
            margin-top: 20px;
        }
        #hud {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); color: white; padding: 10px 20px;
            border-radius: 20px; z-index: 999; display: none;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h2>The Phrasal-Filmer</h2>
        <p>"Look Forward To" (lft) deneyimi için başlatın.</p>
        <button id="start-btn">AR DENEYİMİNİ BAŞLAT</button>
    </div>

    <div id="hud">Kamerayı LFT Kartına Tutun</div>

    <a-scene 
        mindar-image="imageTargetSrc: lft.mind; autoStart: false; uiScanning: yes;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false">
        
        <a-assets>
            <!-- Dosya adı sadece lft.mp4 olarak ayarlandı -->
            <video id="ar-video" src="lft.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="target-anchor" mindar-image-target="targetIndex: 0">
            <a-video src="#ar-video" width="3.5" height="1.96" position="0 0 0" material="shader: flat;"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const hud = document.getElementById('hud');
        const video = document.getElementById('ar-video');
        const sceneEl = document.querySelector('a-scene');
        const targetEl = document.querySelector('#target-anchor');

        startBtn.addEventListener('click', () => {
            // Video kilidini aç
            video.play().then(() => {
                video.pause(); 
                video.currentTime = 0;
                video.muted = false; 
            }).catch(e => console.log("Hata:", e));

            sceneEl.systems["mindar-image-system"].start();
            overlay.style.display = 'none';
            hud.style.display = 'block';
        });

        targetEl.addEventListener("targetFound", () => {
            hud.textContent = "Video Oynatılıyor... ✓";
            video.play();
        });

        targetEl.addEventListener("targetLost", () => {
            hud.textContent = "Kamerayı LFT Kartına Tutun";
            video.pause();
        });
    </script>
</body>
</html>
