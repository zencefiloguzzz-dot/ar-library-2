<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; font-family: sans-serif;
        }
        #btn { padding: 15px 30px; font-size: 20px; background: #3498db; color: white; border: none; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="overlay">
        <h3>"Look Forward To" AR Library</h3>
        <button id="btn">DENEYİMİ BAŞLAT</button>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: lft.mind; autoStart: false; uiScanning: yes;" 
        embedded color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false">
        
        <a-assets>
            <video id="lftVideo" src="lft.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="target" mindar-image-target="targetIndex: 0">
            <!-- a-plane kullanarak videoyu bir yüzeye giydiriyoruz, bu yarım görünme sorununu çözer -->
            <a-plane id="video-panel" material="src: #lftVideo; shader: flat; side: double;" 
                     width="1" height="0.56" position="0 0 0.05"></a-plane>
        </a-entity>
    </a-scene>

    <script>
        const btn = document.getElementById('btn');
        const overlay = document.getElementById('overlay');
        const video = document.getElementById('lftVideo');
        const scene = document.querySelector('a-scene');

        btn.addEventListener('click', () => {
            // Video objesini tarayıcıya tanıt ve oynatılabilir hale getir
            video.play().then(() => {
                video.pause();
                video.currentTime = 0;
            });
            scene.systems["mindar-image-system"].start();
            overlay.style.display = 'none';
        });

        const target = document.querySelector('#target');
        target.addEventListener("targetFound", () => { video.play(); });
        target.addEventListener("targetLost", () => { video.pause(); });
    </script>
</body>
</html>
